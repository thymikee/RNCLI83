name: Cali QA

on:
  workflow_run:
    workflows:
      - Android Build
      - iOS Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        required: true
        type: choice
        options:
          - android
          - ios
      source_run_id:
        description: Workflow run id that produced the build artifact
        required: true
        type: string
      pr_number:
        description: Optional pull request number for comment publishing
        required: false
        default: ''
        type: string
      prompt:
        description: Optional QA focus prompt
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  DEFAULT_QA_PROMPT: Run a lightweight smoke test of app launch and the primary visible flow. Report blockers clearly and capture screenshots for meaningful states.

jobs:
  ios-qa:
    name: iOS QA
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'iOS Build') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'ios')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install agent-device
        run: npm install -g agent-device@0.11.9

      - name: Resolve source metadata
        id: source
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PROMPT: ${{ inputs.prompt }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')

          const eventName = process.env.GITHUB_EVENT_NAME
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const sourceRunId =
            eventName === 'workflow_run'
              ? String(event.workflow_run.id)
              : process.env.INPUT_SOURCE_RUN_ID

          if (!sourceRunId) {
            throw new Error('A source workflow run id is required.')
          }

          const workflowUrl =
            eventName === 'workflow_run' && event.workflow_run.html_url
              ? event.workflow_run.html_url
              : `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${sourceRunId}`

          const prNumber =
            eventName === 'workflow_run'
              ? String(event.workflow_run.pull_requests?.[0]?.number ?? '')
              : process.env.INPUT_PR_NUMBER

          const qaPrompt = process.env.INPUT_PROMPT || process.env.DEFAULT_QA_PROMPT

          console.log(`source_run_id=${sourceRunId}`)
          console.log(`workflow_url=${workflowUrl}`)
          console.log(`pr_number=${prNumber}`)
          console.log('artifact_pattern=rn-ios-simulator-*')
          console.log(`qa_prompt=${qaPrompt}`)
          NODE

      - name: Fetch pull request metadata
        if: steps.source.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs')
            const prNumber = Number(process.env.PR_NUMBER)
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            fs.mkdirSync('.cali', { recursive: true })
            fs.writeFileSync(
              '.cali/pr.json',
              JSON.stringify(
                {
                  number: pr.number,
                  title: pr.title,
                  body: pr.body,
                  html_url: pr.html_url,
                  draft: pr.draft,
                  labels: pr.labels.map((label) => ({ name: label.name })),
                  base: { ref: pr.base.ref },
                  head: { ref: pr.head.ref },
                },
                null,
                2
              )
            )

      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          pattern: ${{ steps.source.outputs.artifact_pattern }}
          path: ./.cali/downloaded
          merge-multiple: true

      - name: Prepare iOS artifact
        id: artifact
        run: |
          set -euo pipefail

          mkdir -p .cali/input
          APP_TARBALL="$(find ./.cali/downloaded -type f -name '*.app.tar.gz' | sort | head -n1 || true)"
          if [[ -z "$APP_TARBALL" ]]; then
            echo "No iOS .app.tar.gz artifact found in ./.cali/downloaded"
            exit 1
          fi

          tar -xzf "$APP_TARBALL" -C ./.cali/input

          APP_PATH="$(find ./.cali/input -type d -name '*.app' | sort | head -n1 || true)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No unpacked .app bundle found after extracting $APP_TARBALL"
            exit 1
          fi

          echo "artifact_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve iOS simulator
        id: simulator
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')

          const raw = execFileSync('xcrun', ['simctl', 'list', 'devices', 'available', '-j'], {
            encoding: 'utf8',
          })
          const devices = JSON.parse(raw).devices ?? {}

          let selected
          for (const runtimeDevices of Object.values(devices)) {
            for (const device of runtimeDevices) {
              if (device?.isAvailable && typeof device.name === 'string' && device.name.startsWith('iPhone')) {
                selected = device
                break
              }
            }

            if (selected) {
              break
            }
          }

          if (!selected) {
            throw new Error('No available iPhone simulator was found on the runner.')
          }

          console.log(`device_udid=${selected.udid}`)
          console.log(`device_name=${selected.name}`)
          NODE

      - name: Boot iOS simulator
        run: |
          set -euo pipefail

          xcrun simctl boot "${{ steps.simulator.outputs.device_udid }}" || true
          open -a Simulator --args -CurrentDeviceUDID "${{ steps.simulator.outputs.device_udid }}"
          xcrun simctl bootstatus "${{ steps.simulator.outputs.device_udid }}" -b
          agent-device devices --platform ios

      - name: Write Cali context
        run: |
          set -euo pipefail

          PR_ARGS=()
          if [[ -f ./.cali/pr.json ]]; then
            PR_ARGS+=(--pr-json ./.cali/pr.json)
          fi

          node ./scripts/cali/write-workflow-run-context.mjs \
            --output ./.cali/cali-context.json \
            --platform ios \
            --artifact "${{ steps.artifact.outputs.artifact_path }}" \
            --output-dir ./artifacts/qa \
            --build-id "${{ steps.source.outputs.source_run_id }}" \
            --workflow-url "${{ steps.source.outputs.workflow_url }}" \
            "${PR_ARGS[@]}"

      - name: Run Cali QA
        id: cali
        continue-on-error: true
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          QA_MODEL: ${{ vars.QA_MODEL || 'openai/gpt-5.4-mini' }}
        run: |
          npx cali qa \
            --env mobile-pr \
            --context ./.cali/cali-context.json \
            --prompt "${{ steps.source.outputs.qa_prompt }}"

      - name: Append QA summary
        if: always() && hashFiles('artifacts/qa/section.md') != ''
        run: cat ./artifacts/qa/section.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifacts
        if: always() && hashFiles('artifacts/qa/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cali-qa-ios-${{ steps.source.outputs.source_run_id }}
          path: ./artifacts/qa
          if-no-files-found: error
          retention-days: 7

      - name: Upsert pull request comment
        if: always() && steps.source.outputs.pr_number != '' && hashFiles('artifacts/qa/comment-github.md') != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs')

            const marker = '<!-- cali-qa:ios -->'
            const body = `${marker}\n${fs.readFileSync('./artifacts/qa/comment-github.md', 'utf8').trim()}`
            const issueNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            })

      - name: Enforce QA status
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -f ./artifacts/qa/status.txt ]]; then
            echo "Cali QA did not produce artifacts/qa/status.txt"
            exit 1
          fi

          STATUS="$(cat ./artifacts/qa/status.txt)"
          echo "Cali QA status: $STATUS"
          if [[ "$STATUS" != "passed" ]]; then
            exit 1
          fi

  android-qa:
    name: Android QA
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Android Build') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install agent-device
        run: npm install -g agent-device@0.11.9

      - name: Resolve source metadata
        id: source
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PROMPT: ${{ inputs.prompt }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')

          const eventName = process.env.GITHUB_EVENT_NAME
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const sourceRunId =
            eventName === 'workflow_run'
              ? String(event.workflow_run.id)
              : process.env.INPUT_SOURCE_RUN_ID

          if (!sourceRunId) {
            throw new Error('A source workflow run id is required.')
          }

          const workflowUrl =
            eventName === 'workflow_run' && event.workflow_run.html_url
              ? event.workflow_run.html_url
              : `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${sourceRunId}`

          const prNumber =
            eventName === 'workflow_run'
              ? String(event.workflow_run.pull_requests?.[0]?.number ?? '')
              : process.env.INPUT_PR_NUMBER

          const qaPrompt = process.env.INPUT_PROMPT || process.env.DEFAULT_QA_PROMPT

          console.log(`source_run_id=${sourceRunId}`)
          console.log(`workflow_url=${workflowUrl}`)
          console.log(`pr_number=${prNumber}`)
          console.log('artifact_pattern=rn-android-emulator-*')
          console.log(`qa_prompt=${qaPrompt}`)
          NODE

      - name: Fetch pull request metadata
        if: steps.source.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs')
            const prNumber = Number(process.env.PR_NUMBER)
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            fs.mkdirSync('.cali', { recursive: true })
            fs.writeFileSync(
              '.cali/pr.json',
              JSON.stringify(
                {
                  number: pr.number,
                  title: pr.title,
                  body: pr.body,
                  html_url: pr.html_url,
                  draft: pr.draft,
                  labels: pr.labels.map((label) => ({ name: label.name })),
                  base: { ref: pr.base.ref },
                  head: { ref: pr.head.ref },
                },
                null,
                2
              )
            )

      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          pattern: ${{ steps.source.outputs.artifact_pattern }}
          path: ./.cali/downloaded
          merge-multiple: true

      - name: Prepare Android artifact
        id: artifact
        run: |
          set -euo pipefail

          APK_PATH="$(find ./.cali/downloaded -type f -name '*.apk' | sort | head -n1 || true)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No Android .apk artifact found in ./.cali/downloaded"
            exit 1
          fi

          echo "artifact_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Write Cali context
        run: |
          set -euo pipefail

          PR_ARGS=()
          if [[ -f ./.cali/pr.json ]]; then
            PR_ARGS+=(--pr-json ./.cali/pr.json)
          fi

          node ./scripts/cali/write-workflow-run-context.mjs \
            --output ./.cali/cali-context.json \
            --platform android \
            --artifact "${{ steps.artifact.outputs.artifact_path }}" \
            --output-dir ./artifacts/qa \
            --build-id "${{ steps.source.outputs.source_run_id }}" \
            --workflow-url "${{ steps.source.outputs.workflow_url }}" \
            "${PR_ARGS[@]}"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Cali QA
        id: cali
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          QA_MODEL: ${{ vars.QA_MODEL || 'openai/gpt-5.4-mini' }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            agent-device devices --platform android
            npx cali qa \
              --env mobile-pr \
              --context ./.cali/cali-context.json \
              --prompt "${{ steps.source.outputs.qa_prompt }}"

      - name: Append QA summary
        if: always() && hashFiles('artifacts/qa/section.md') != ''
        run: cat ./artifacts/qa/section.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifacts
        if: always() && hashFiles('artifacts/qa/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cali-qa-android-${{ steps.source.outputs.source_run_id }}
          path: ./artifacts/qa
          if-no-files-found: error
          retention-days: 7

      - name: Upsert pull request comment
        if: always() && steps.source.outputs.pr_number != '' && hashFiles('artifacts/qa/comment-github.md') != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs')

            const marker = '<!-- cali-qa:android -->'
            const body = `${marker}\n${fs.readFileSync('./artifacts/qa/comment-github.md', 'utf8').trim()}`
            const issueNumber = Number(process.env.PR_NUMBER)

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            })

      - name: Enforce QA status
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -f ./artifacts/qa/status.txt ]]; then
            echo "Cali QA did not produce artifacts/qa/status.txt"
            exit 1
          fi

          STATUS="$(cat ./artifacts/qa/status.txt)"
          echo "Cali QA status: $STATUS"
          if [[ "$STATUS" != "passed" ]]; then
            exit 1
          fi
