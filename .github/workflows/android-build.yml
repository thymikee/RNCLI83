name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      android_variant:
        description: Android Gradle variant
        required: true
        default: Debug
        type: string
      custom_identifier:
        description: Optional custom artifact identifier (e.g. pr-123, nightly)
        required: false
        default: ''
        type: string
      artifact_retention_days:
        description: Artifact retention in days
        required: true
        default: '7'
        type: string
      run_cali_qa:
        description: Run Cali QA after the build
        required: true
        default: false
        type: boolean
      qa_prompt:
        description: Optional Cali QA focus prompt
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  DEFAULT_QA_PROMPT: Run a lightweight smoke test of app launch and the primary counter flow. If standard OS permission prompts appear, choose the option that allows continuing into the app, then continue testing. The expected app screen is titled Agent Device Tester and includes a numeric count plus an Increment button. Verify that screen is visible and tap Increment once if available. If launch and this primary smoke interaction work without blockers, report passed; do not mark unsure just because the PR changes are CI-only or the smoke scope is intentionally limited. Report blockers clearly and capture screenshots for meaningful states.

jobs:
  android:
    name: Android emulator build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Determine Android variant
        id: android-variant
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.android_variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine custom artifact identifier
        id: custom-identifier
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.custom_identifier }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine artifact retention
        id: retention
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.artifact_retention_days }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=7" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android emulator APK
        id: build
        uses: ./.github/actions/github-actions-react-native-build-artifacts/android-build
        with:
          variant: ${{ steps.android-variant.outputs.value }}
          artifact-prefix: rn-android-emulator
          custom-identifier: ${{ steps.custom-identifier.outputs.value }}
          artifact-retention-days: ${{ steps.retention.outputs.value }}

      - name: Publish artifact metadata
        run: |
          {
            echo "## Android Build Artifact"
            echo ""
            echo "- Android emulator (.apk): name=${{ steps.build.outputs.artifact-name }}, id=${{ steps.build.outputs.artifact-id }}"
            echo ""
            echo "Artifact URL (auth required):"
            echo "- Android: ${{ steps.build.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android-qa:
    name: Android Cali QA
    needs: android
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_cali_qa == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install agent-device
        run: npm install -g agent-device@0.11.9

      - name: Install Cali skills
        run: |
          npx skills add callstackincubator/agent-device --skill agent-device -y

      - name: Reset agent-device state
        run: |
          rm -f "${HOME}/.agent-device/daemon.json" "${HOME}/.agent-device/daemon.sock"

      - name: Resolve QA prompt
        id: qa-prompt
        env:
          INPUT_QA_PROMPT: ${{ inputs.qa_prompt }}
        run: |
          PROMPT="${INPUT_QA_PROMPT:-$DEFAULT_QA_PROMPT}"
          echo "value=$PROMPT" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.android.outputs.artifact-name }}
          path: ./.cali/downloaded

      - name: Resolve Android artifact
        id: artifact
        run: |
          set -euo pipefail

          APK_PATH="$(find ./.cali/downloaded -type f -name '*.apk' | sort | head -n1 || true)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No Android .apk artifact found in ./.cali/downloaded"
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Cali QA
        id: cali
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          QA_MODEL: ${{ vars.QA_MODEL || 'openai/gpt-5.4-mini' }}
          QA_ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          QA_PROMPT_VALUE: ${{ steps.qa-prompt.outputs.value }}
          QA_APP_ID: com.rncli83
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            bash ./scripts/ci/run-cali-qa-with-metro.sh android "$QA_ARTIFACT_PATH" "$QA_PROMPT_VALUE" "$QA_APP_ID"

      - name: Export CI outputs
        if: always() && hashFiles('artifacts/qa/report.json') != ''
        run: |
          npx cali export-ci --quiet --report ./artifacts/qa/report.json

      - name: Append QA summary
        if: always() && hashFiles('artifacts/qa/section.md') != ''
        run: cat ./artifacts/qa/section.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifacts
        if: always() && hashFiles('artifacts/qa/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cali-qa-android-${{ github.run_id }}
          path: ./artifacts/qa
          if-no-files-found: error
          retention-days: 7

      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('artifacts/qa/ci-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_MARKER: '<!-- cali-qa:android -->'
        run: |
          set -euo pipefail

          COMMENT_BODY="$(mktemp)"
          {
            echo "$COMMENT_MARKER"
            cat ./artifacts/qa/ci-comment.md
          } > "$COMMENT_BODY"

          COMMENT_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq ".[] | select((.body // \"\") | contains(\"${COMMENT_MARKER}\")) | .id" \
              | head -n1
          )"

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F "body=@${COMMENT_BODY}" --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${COMMENT_BODY}" --silent
          fi

      - name: Enforce QA status
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -f ./artifacts/qa/status.txt ]]; then
            echo "Cali QA did not produce artifacts/qa/status.txt"
            exit 1
          fi

          STATUS="$(cat ./artifacts/qa/status.txt)"
          echo "Cali QA status: $STATUS"
          if [[ "$STATUS" != "passed" ]]; then
            exit 1
          fi
